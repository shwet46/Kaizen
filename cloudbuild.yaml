# ==============================================================================
# Google Cloud Build Pipeline for Kaizen (UI, Backend, & Voice Bot)
# Run with: gcloud builds submit --config=cloudbuild.yaml
# ==============================================================================

steps:
  # 1. Build and push Backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/kaizen-backend:latest', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kaizen-backend:latest']

  # 2. Build and push Bot image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/kaizen-bot:latest', './backend/bot']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kaizen-bot:latest']

  # 3. Build and push Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kaizen-frontend:latest'
      - './frontend'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kaizen-frontend:latest']

images:
  - 'gcr.io/$PROJECT_ID/kaizen-backend:latest'
  - 'gcr.io/$PROJECT_ID/kaizen-bot:latest'
  - 'gcr.io/$PROJECT_ID/kaizen-frontend:latest'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
